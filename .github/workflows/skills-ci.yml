name: Toolfarm Skills CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  precedence-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check skills/agent-skill-precedence-preflight/scripts/check-precedence.mjs
      - name: Smoke test
        run: node skills/agent-skill-precedence-preflight/scripts/smoke-test.mjs

  registry-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check skills/agent-skill-registry-snapshot-drift-checker/scripts/check-registry-drift.mjs
      - name: Smoke test
        run: node skills/agent-skill-registry-snapshot-drift-checker/scripts/smoke-test.mjs

  credential-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check skills/ai-sdk-credential-boundary-preflight/scripts/check-credential-boundary.mjs
      - name: Smoke test
        run: node skills/ai-sdk-credential-boundary-preflight/scripts/smoke-test.mjs

  codex-action-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check actions/codex-action-safety-preflight/scripts/check-codex-action.mjs
      - name: Smoke test
        run: node actions/codex-action-safety-preflight/scripts/smoke-test.mjs
      - name: Composite action smoke test
        uses: ./actions/codex-action-safety-preflight
        with:
          path: .github/workflows

  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify skills CLI GitHub discovery
        shell: bash
        run: |
          npx -y skills add tzlee123/toolfarm-skills --list | tee /tmp/toolfarm-skills-list.txt
          grep -q "agent-skill-precedence-preflight" /tmp/toolfarm-skills-list.txt
          grep -q "agent-skill-registry-snapshot-drift-checker" /tmp/toolfarm-skills-list.txt
          grep -q "ai-sdk-credential-boundary-preflight" /tmp/toolfarm-skills-list.txt

  domain-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Toolfarm domain Agent Skills discovery
        shell: bash
        run: |
          npx -y skills@latest add https://www.toolfarm.app --list | tee /tmp/toolfarm-domain-skills.txt
          grep -q "agent-skill-precedence-preflight" /tmp/toolfarm-domain-skills.txt
          grep -q "agent-skill-registry-snapshot-drift-checker" /tmp/toolfarm-domain-skills.txt
          grep -q "ai-sdk-credential-boundary-preflight" /tmp/toolfarm-domain-skills.txt
          grep -q "codex-action-safety-preflight" /tmp/toolfarm-domain-skills.txt
